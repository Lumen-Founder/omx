[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "omx-hyperliquid"               # distribution name (PyPI); the import package is `omx`
version = "0.1.8"
description = "Non-custodial, policy-checked execution engine for Hyperliquid (CLI + MCP for AI agents)"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = ["hyperliquid-python-sdk==0.20.0", "eth-account", "msgpack", "requests", "mcp>=2.3"]
keywords = ["hyperliquid", "mcp", "mcp-server", "model-context-protocol", "ai-agents", "trading", "perpetuals",
            "twap", "execution", "non-custodial", "paper-trading"]
classifiers = ["License :: OSI Approved :: MIT License", "Programming Language :: Python :: 3",
               "Operating System :: OS Independent", "Topic :: Office/Business :: Financial :: Investment"]

[project.urls]
Homepage = "https://github.com/Lumen-Founder/omx-hyperliquid-mcp"
Source = "https://github.com/Lumen-Founder/omx-hyperliquid-mcp"
Issues = "https://github.com/Lumen-Founder/omx-hyperliquid-mcp/issues"
Examples = "https://github.com/Lumen-Founder/omx-integrations"

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
omx = "omx.cli:main"
omx-mcp = "omx.mcp_server:main"
omx-hyperliquid = "omx.mcp_server:hyperliquid_main"   # what `uvx omx-hyperliquid` runs; no config -> demo

[tool.setuptools.packages.find]
include = ["omx*"]
