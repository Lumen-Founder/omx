# Publish to PyPI (trusted publishing, no token) and then to the official MCP Registry (GitHub OIDC, no login).
# Run by hand from the Actions tab after the PyPI pending publisher for this repo/workflow exists.
name: publish

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pypi:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build==1.2.2
      - run: python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1

  mcp-registry:
    needs: pypi
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher
      - name: Wait for the PyPI release to be visible
        run: |
          v=$(python3 -c "import json;print(json.load(open('server.json'))['version'])")
          for i in $(seq 1 30); do curl -sf "https://pypi.org/pypi/omx-hyperliquid/$v/json" > /dev/null && exit 0; sleep 20; done; exit 1
      - run: ./mcp-publisher login github-oidc
      - run: ./mcp-publisher publish
