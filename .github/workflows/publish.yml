# Publish to PyPI (trusted publishing, no token) and then to the official MCP Registry (GitHub OIDC, no login).
# Run by hand from the Actions tab after the PyPI pending publisher for this repo/workflow exists.
name: publish

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pypi:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install build==1.2.2
      - run: python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

  mcp-registry:
    needs: pypi
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - name: Install mcp-publisher
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/download/v1.8.7/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher
      - name: Wait for the PyPI release to be visible
        run: |
          v=$(python3 -c "import json;print(json.load(open('server.json'))['version'])")
          for i in $(seq 1 30); do curl -sf "https://pypi.org/pypi/omx-hyperliquid/$v/json" > /dev/null && exit 0; sleep 20; done; exit 1
      - run: ./mcp-publisher login github-oidc
      - run: ./mcp-publisher publish
      # The first registry name had no search keyword (registry search matches names only); point it at the new one.
      - name: Deprecate the old registry name
        continue-on-error: true
        run: |
          ./mcp-publisher status --status deprecated --all-versions --yes \
            --message "Renamed to io.github.Lumen-Founder/omx-hyperliquid-trading (same package, omx-hyperliquid)" \
            io.github.Lumen-Founder/omx
