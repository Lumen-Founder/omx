# OMX config. Public data and references only: never paste a private key here.
network = "testnet"                 # "testnet" first, "mainnet" later
account_address = "0x0000000000000000000000000000000000000000"  # your MAIN account's public address
state_dir = "state"
# audit_path = "state/audit.jsonl"
order_expiry_ms = 15000              # every signed order/cancel expires this long after signing (2000..60000)
# lock_dir = "..."                   # per-account lock dir (default %LOCALAPPDATA%/omx/locks)

[signer]
# The API/agent wallet key is referenced, never embedded. Set exactly one.
key_path = "secrets/hl_agent_testnet.key"

[builder]
# address = "0x..."
fee_tenths_bps = 0             # 0 = no builder fee; 10 = 1 bps; max 100 (10 bps)

[policy]
allowed_coins = ["BTC", "ETH", "SOL"]
min_day_ntl_usd = 50000000.0
min_depth_usd = 250000.0
depth_band_bps = 25.0
price_band_bps = 100.0
default_coin_notional_usd = 10000.0
max_account_notional_usd = 25000.0
max_leverage = 3.0
max_daily_loss_usd = 500.0
max_data_age_ms = 3000
max_child_notional_usd = 5000.0
allow_agent_sources = true

[policy.max_coin_notional_usd]
# BTC = 15000.0

[agent]
enabled = false
approval_above_usd = 1000.0       # per-intent notional above this waits for a human
daily_budget_usd = 5000.0         # agent notional per UTC day; beyond it every intent waits for a human
allowed_coins = ["BTC", "ETH"]    # must be a subset of policy.allowed_coins
approval_ttl_s = 600
